[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "signalpipe-daemon"
version = "1.0.0"
description = "User-side sender for SignalPipe v4 — streams pre-drafted, pre-approved missions and posts them with your own Reddit/X credentials. The math runs on SignalPipe; the sending runs on you."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SignalPipe" }]
keywords = ["signalpipe", "outreach", "reddit", "twitter", "sse", "automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
reddit = ["praw>=7.7"]
twitter = ["tweepy>=4.14"]
all = ["praw>=7.7", "tweepy>=4.14"]

[project.scripts]
signalpipe-daemon = "signalpipe_daemon.cli:main"

[project.urls]
Homepage = "https://signalpipe.io"

[tool.setuptools]
packages = ["signalpipe_daemon"]
